<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>mi primer proyecto</title>
</head>
<body>

    <!-- Navegación con 4 enlaces de anclaje -->
    <nav>
        <a href="#alimentos">Alimentos Favoritos</a>
        <a href="#logros">Logros</a>
        <a href="#sobre-mi">Más Acerca de Mí</a>
        <a href="https://www.intro-webdesign.com" target="_blank">Intro Web Design</a>
    </nav>

    <h1>Mi Primer Proyecto</h1>

    <!-- Sección Alimentos Favoritos (Encabezado h2 y 4 elementos de lista) -->
    <section id="alimentos">
        <h2>Alimentos Favoritos</h2>
        <ul>
            <li>Aguacate</li>
            <li>Pescado</li>
            <li>Cerdo</li>
            <li>Frutas frescas</li>
        </ul>
    </section>

    <!-- Sección Logros (Encabezado h2 y 3 barras de progreso) -->
    <section id="logros">
        <h2>Logros</h2>
        <label for="progreso1">Progreso Académico:</label>
        <progress id="progreso1" value="70" max="100">70%</progress><br>

        <label for="progreso2">Habilidades de Códificación:</label>
        <progress id="progreso2" value="50" max="100">50%</progress><br>

        <label for="progreso3">Rendimiento Deportivo:</label>
        <progress id="progreso3" value="80" max="100">80%</progress>
    </section>

    <!-- Sección Más Acerca de Mí (Encabezado h2, detalles y resumen) -->
    <section id="sobre-mi">
        <h2>Más Acerca de Mí</h2>
        <details>
            <summary>Conoce más sobre mí</summary>
            <p>Me gusta el deporte y actualmente soy estudiante de ingeniería.</p>
            <img src="https://via.placeholder.com/150" alt="Imagen de perfil o proyecto">
        </details>
    </section>

</body>
</html>
